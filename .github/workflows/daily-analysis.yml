name: Daily Stock Analysis

on:
  schedule:
    # 07:00 IST = 01:30 UTC every day
    - cron: '30 1 * * *'
  workflow_dispatch:  # allow manual trigger from the GitHub Actions UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # generous limit; pipeline scans ~500 NSE stocks

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need write access to push updated results back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: https://api.groq.com/openai/v1
          OPENAI_MODEL: openai/gpt-oss-120b
        run: |
          python run_all_Version.py \
            --limit 0 \
            --shortlist-top-n 20 \
            --skip-fresh-days 7

      - name: Commit and push updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/output/qualitative_llm_output.csv
          git add -f data/output/nse_quant_output.csv
          git add -f data/output/qualitative_llm_input.csv
          git add -f reports/qualitative/
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "chore: daily analysis $(date -u '+%Y-%m-%d')"
          git push
