services:
  # 1) Existing API service (keep)
  - type: web
    name: indian-stock-ai-agent
    runtime: python
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: |
      pip install -r requirements.txt
      pip install -r webapp/backend/requirements.txt
    startCommand: uvicorn webapp.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_SLEEP
        value: "3"

  # 2) New staging Flask screener service
  - type: web
    name: indian-stock-ai-staging
    runtime: python
    plan: free
    autoDeploy: true
    rootDir: .
    buildCommand: |
      pip install -r requirements.txt
    startCommand: gunicorn "webapp.backend.app:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9