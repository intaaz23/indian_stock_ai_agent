services:
  - type: web
    name: indian-stock-ai-agent
    env: python
    plan: free
    region: oregon

    # Build both root + backend deps
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      pip install -r webapp/backend/requirements.txt

    # Run FastAPI app
    startCommand: uvicorn webapp.backend.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        sync: false