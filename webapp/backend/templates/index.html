<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Indian Stock AI Agent</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .row { margin-bottom: 12px; }
    input { padding: 6px; width: 90px; margin-right: 8px; }
    button { padding: 8px 12px; margin-right: 8px; cursor: pointer; }
    #status { margin: 12px 0; font-weight: bold; }
    .small { color: #555; font-size: 12px; margin-top: 4px; }

    table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
    th { background: #1f4e78; color: #fff; }
    tr:nth-child(even) { background: #f8fbff; }

    img { max-width: 100%; border: 1px solid #ccc; margin-top: 16px; }

    .section-title { margin-top: 22px; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 12px;
      color: #fff;
      font-weight: 600;
    }
    .success { background: #2e7d32; }
    .partial_success { background: #ef6c00; }
    .failed { background: #c62828; }
    .running { background: #1565c0; }
    .queued { background: #6a1b9a; }
  </style>
</head>
<body>
  <h2>Indian Stock AI Agent - Demo</h2>

  <div class="row">
    <label>Top N:</label>
    <input id="topN" type="number" value="20" min="1" max="100" />
    <label>Limit:</label>
    <input id="limitN" type="number" value="20" min="1" max="200" />
    <button id="runBtn" onclick="runAnalysis()">Run Analysis</button>
    <button onclick="loadResults()">Load Latest Results</button>
    <button onclick="loadImage()">Show PNG Report</button>
    <button onclick="loadJobs()">Refresh Last Runs</button>
  </div>

  <div id="status">Status: Idle</div>
  <div class="small" id="jobId"></div>

  <h3 class="section-title">Latest Results</h3>
  <div id="tableContainer"></div>

  <h3 class="section-title">PNG Report</h3>
  <div id="imageContainer"></div>

  <h3 class="section-title">Last Runs (Top 10)</h3>
  <div id="jobsContainer"></div>

  <script>
    let currentJobId = null;

    function statusBadge(status) {
      const cls = ["success","partial_success","failed","running","queued"].includes(status)
        ? status
        : "queued";
      return `<span class="badge ${cls}">${status}</span>`;
    }

    async function runAnalysis() {
      const top_n = parseInt(document.getElementById("topN").value || "20");
      const limit = parseInt(document.getElementById("limitN").value || "20");
      const runBtn = document.getElementById("runBtn");

      document.getElementById("status").innerText = "Status: submitting job...";
      document.getElementById("jobId").innerText = "";

      const res = await fetch("/run-analysis", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ top_n, limit })
      });

      const data = await res.json();

      if (!res.ok) {
        document.getElementById("status").innerText = "Status: submit failed";
        alert(data.detail || "Failed to submit");
        await loadJobs();
        return;
      }

      currentJobId = data.job_id;
      document.getElementById("status").innerText = `Status: ${data.status}`;
      document.getElementById("jobId").innerText = `Job ID: ${currentJobId}`;
      runBtn.disabled = true;

      await loadJobs();
      pollStatus(currentJobId);
    }

    async function pollStatus(jobId) {
      const runBtn = document.getElementById("runBtn");

      const timer = setInterval(async () => {
        const res = await fetch(`/job-status/${jobId}`);
        const data = await res.json();

        if (!res.ok) {
          document.getElementById("status").innerText = "Status: error checking job";
          clearInterval(timer);
          runBtn.disabled = false;
          return;
        }

        document.getElementById("status").innerText = `Status: ${data.status} | ${data.message}`;

        if (data.status === "success" || data.status === "partial_success") {
          clearInterval(timer);
          runBtn.disabled = false;
          await loadResults();
          await loadImage();
          await loadJobs();
        } else if (data.status === "failed") {
          clearInterval(timer);
          runBtn.disabled = false;
          await loadJobs();
          alert(`Job failed: ${data.error || "Unknown error"}`);
        } else {
          // queued/running
          await loadJobs();
        }
      }, 2000);
    }

    async function loadResults() {
      const top_n = parseInt(document.getElementById("topN").value || "20");
      const res = await fetch(`/latest-results?top_n=${top_n}`);
      const data = await res.json();

      if (!res.ok) {
        document.getElementById("tableContainer").innerHTML = "<p>No latest results yet.</p>";
        return;
      }

      renderResultsTable(data.results);
    }

    function renderResultsTable(rows) {
      const box = document.getElementById("tableContainer");
      if (!rows || rows.length === 0) {
        box.innerHTML = "<p>No rows found.</p>";
        return;
      }

      const cols = Object.keys(rows[0]);
      let html = "<table><thead><tr>";
      cols.forEach(c => html += `<th>${c}</th>`);
      html += "</tr></thead><tbody>";

      rows.forEach(r => {
        html += "<tr>";
        cols.forEach(c => html += `<td>${r[c] ?? ""}</td>`);
        html += "</tr>";
      });
      html += "</tbody></table>";
      box.innerHTML = html;
    }

    async function loadImage() {
      const imgUrl = `/latest-report-image?t=${Date.now()}`;
      document.getElementById("imageContainer").innerHTML =
        `<img src="${imgUrl}" alt="Final Report PNG" onerror="this.parentElement.innerHTML='<p>No PNG report yet.</p>'" />`;
    }

    async function loadJobs() {
      const res = await fetch("/jobs?limit=10");
      const data = await res.json();

      if (!res.ok || !data.items) {
        document.getElementById("jobsContainer").innerHTML = "<p>Unable to load run history.</p>";
        return;
      }

      const rows = data.items;
      if (!rows.length) {
        document.getElementById("jobsContainer").innerHTML = "<p>No runs yet.</p>";
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>Job ID</th>
              <th>Status</th>
              <th>Top N</th>
              <th>Limit</th>
              <th>Duration (s)</th>
              <th>Created (UTC)</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>
      `;

      for (const r of rows) {
        html += `
          <tr>
            <td style="font-size:11px">${r.job_id}</td>
            <td>${statusBadge(r.status)}</td>
            <td>${r.top_n ?? ""}</td>
            <td>${r.limit_n ?? ""}</td>
            <td>${r.duration_seconds ?? ""}</td>
            <td>${r.created_at ?? ""}</td>
            <td>${r.message ?? ""}</td>
          </tr>
        `;
      }

      html += "</tbody></table>";
      document.getElementById("jobsContainer").innerHTML = html;
    }

    // initial load
    window.addEventListener("load", async () => {
      await loadJobs();
      await loadResults();
      await loadImage();
    });
  </script>
</body>
</html>
